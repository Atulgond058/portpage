<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portfolio</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">My<span>Portfolio</span></a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About & Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <div class="menu-toggle" id="mobile-menu"><i class="fas fa-bars"></i></div>
        </div>
    </nav>
    <main class="main-content">
        <section class="page-section">
            <h2 class="page-title">Get In Touch</h2>
            <div class="contact-container">
                <form id="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Your Name">
                        <span class="error-msg" id="name-error">Name is required (min 3 characters).</span>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Your Email">
                        <span class="error-msg" id="email-error">Enter a valid email address.</span>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="Write message here..."></textarea>
                        <span class="error-msg" id="message-error">Message must be at least 10 characters long.</span>
                    </div>
                    <button type="submit" class="btn" style="width:100%;">Submit Form</button>
                    <div id="form-success" class="success-msg">Message validated and processed!</div>
                </form>
            </div>
        </section>
    </main>
    <footer><p>&copy; 2026 Your Name. All Rights Reserved.</p></footer>
    <script src="script.js"></script>
</body>
</html>
